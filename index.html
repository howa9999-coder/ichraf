<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css">
    <link rel="manifest" href="manifest.json"> 
    <title>المعين - الصفحة الرئيسية</title>
</head>
<body>

    <header class="main-header">
        <h1 class="app-name"> المعين على الإشراف</h1>
        <p class="slogan">رفيقك في خدمة القرآن</p>
    </header>

    <main class="container">
        <section class="feature-card">
            <div class="feature-info btns-container">
                <div class="input-container">
                    <label class="label" for="admin-name">إسم المشرفة الخاصة</label>
                    <input type="text" id="admin-name">
                </div>
            </div>
        </section>

        <!-- Groups section -->
        <section class="feature-card" id="listView">
            <div class="feature-info">
                <h3> المجموعات</h3>
                <div class="btns-container">
                    <button class="btn add-btn" onclick="document.getElementById('addGroupModal').showModal()">إضافة مجموعة</button>
                </div>
                <div class="groups-container cards-grid" id="groupsContainer" style="margin-top: 15px;">
                </div>                

            </div>
        </section>

        <hr class="divider">

        <section class="how-to-use">
            <a href="#"><h2>إرشادات الاستخدام</h2></a>
            <p>يمكنك استخدام التطبيق لإضافة بطاقات الطالبات وإنجاز التقارير بكل سهولة.</p>
            <button id="install-btn" style="display:none;" class="install-btn">تثبيت التطبيق</button>
        </section>
    </main>

    <!-- Add New Group -->
    <dialog id="addGroupModal">
        <button class="btn close-btn"  onclick="document.getElementById('addGroupModal').close()">X</button>
        <h3>مجموعة جديدة</h3>
        <input type="text" id="group-name" placeholder=" إسم المجموعة">
        <input type="text" id="teacher-name" placeholder=" إسم أستاذة">
        <button class="btn add-btn " id="addGroupBtn" style="margin-bottom: 10px;" onclick="document.getElementById('addGroupModal').close()">حفظ</button>
    </dialog> 




    <script src="js/home.js"></script>
</body>
</html>
