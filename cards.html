<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="manifest" href="manifest.json">
    <title>المعين</title>
</head>
<body>

    <header class="main-header">
        <h1 class="app-name"> <a href="index.html"> المعين على الإشراف</a></h1>
        <p class="slogan">رفيقك في خدمة القرآن</p>
    </header>

    <main class="container">
        <!-- buttons container card -->
        <section class="feature-card" id="header-card">
            <div class="feature-info btns-container">
                <select class="select-name" name="" id="names">
                </select>
                <button class="btn add-btn" id="clear-cards" style="max-width: 200px" onclick="addCardFunction(event)">إضافة بطاقة </button>
                <button class="btn clear-btn" id="add-card" style="max-width: 200px" onclick="clearCardFunction(event)">حذف البطاقات </button>
            </div>
        </section>
        <!-- cards section -->
        <section class="cards-container">
        </section>
    </main>
    <script src="js/cards.js"></script>
</body>
</html>
